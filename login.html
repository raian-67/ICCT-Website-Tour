<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
</head>
<body>
  <main>
    <header>
      <h1>Welcome back!</h1>
      <p>Login to Access Dashboard.</p>
    </header>

    <section>
      <h2>Log in</h2>
      <form action="dashboard.html" method="get">
        <p>
          <label for="email">Email address</label><br />
          <input type="email" id="email" name="email" placeholder="username@example.com" required />
        </p>

        <p>
          <label for="password">Password</label><br />
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </p>

        <p>
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember">Remember me</label>
        </p>

        <p>
          <button type="submit">Log in</button>
        </p>
      </form>
    </section>

    <aside>
      <p>Need an account? <a href="signup.html">Create one here</a>.</p>
      <p id="error-message" style="color: red; font-weight: bold;"></p>

<form action="dashboard.html" method="get">
  </form>

<script src="auth.js"></script>
</body>
    </aside>

    <footer>
      <p>&copy; 2026 ICCT. All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
