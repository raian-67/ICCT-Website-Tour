<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found</title>
  <meta name="description" content="A custom 404 error page that helps users get back on track.">
</head>
<body>
  <article class="page-shell" aria-labelledby="error-title">
    <header class="topbar">
      <nav class="nav" aria-label="Primary">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms</a>
        <a href="helpcenter.html">Help Center</a>
      </nav>
    </header>

    <main id="main-content">
      <section class="hero error-hero" aria-labelledby="error-title">
        <span class="error-code">404</span>
        <p class="eyebrow">Page not found</p>
        <h1 id="error-title">We can't find that page.</h1>
        <p>
          The page you are looking for may have been removed, or is temporarily unavailable.
        </p>
        <div class="hero-actions" role="group" aria-label="Primary actions" style="justify-content:center;">
          <a class="button primary" href="privacy.html">Go home</a>
          <a class="button secondary" href="helpcenter.html">Visit help center</a>
        </div>
      </section>

    </main>

    <footer class="footer">
      <span>Policy Studio</span>
      <span><a class="inline-link" href="mailto:support@example.com">support@example.com</a></span>
    </footer>
  </article>
</body>
</html>
